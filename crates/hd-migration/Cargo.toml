[package]
name = "hd-migration"
version = "1.3.1-pre.1"
edition = "2021"
rust-version = "1.88"
license-file = "../../LICENSE"
publish = [ "sl" ]

[dependencies]
derivation-path = { workspace = true }
garbled-circuit = { workspace = true, features = ["circuit-sha512"] }
group = { workspace = true }
hmac = { workspace = true }
k256 = { workspace = true, features = ["arithmetic"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
sha2 = { workspace = true }
signature = { workspace = true }
sl-compute-common = { workspace = true }
sl-messages = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = "0.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
test-support = []
