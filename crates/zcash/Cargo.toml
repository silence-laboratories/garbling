[package]
name = "zcash"
version = "0.1.0-pre.6"
edition = "2024"
license-file = "../../LICENSE"
rust-version = "1.88"
publish = [ "sl" ]
include = [
  "/benches",
  "/src/",
]


[dependencies]
ff = { workspace = true }
garbled-circuit = { workspace = true, features = ["circuit-blake2b"] }
group = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.15", optional = true }
sha2 = { workspace = true }
sl-compute-common = { workspace = true }
sl-messages = { workspace = true }
sl-secret-sharing = { workspace = true }
hex = "0.4"
orchard = "0.13.0"
pasta_curves = "0.5.1"
ciborium = { version = "0.2", optional = true }
crypto_box = { version = "0.9", optional = true }
multi-party-schnorr = { version = "1.2.0-pre.1", optional = true, features = [
    "serde",
    "session",
    "keyshare-session-id",
    "redpallas",
]}

[dev-dependencies]
blake2b_simd = "1.0.4"
ciborium = "0.2"
criterion = "0.5.1"
garbled-circuit = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "blake2b_bench"
harness = false

[features]
default = ["dkg"]
serde = ["dep:serde", "rand_chacha/serde1", "dep:serde_bytes"]
session = []
dkg = ["session", "dep:ciborium", "dep:multi-party-schnorr", "dep:crypto_box", "serde"]
