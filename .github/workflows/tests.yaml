name: Continuous Integration

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

env:
  CARGO_REGISTRIES_SL_TOKEN: ${{ secrets.CARGO_REGISTRIES_SL_TOKEN }}
  CARGO_REGISTRIES_SL_INDEX: https://git.shipyard.rs/silencelaboratories/crate-index.git

jobs:
  lints:
    name: Lints
    runs-on: github-builder
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"

      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all --workspace --locked -- -D warnings

  build-and-test:
    name: Rust tests
    runs-on: github-builder
    needs: lints
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"

      - run: cargo test --tests --all --release --locked
