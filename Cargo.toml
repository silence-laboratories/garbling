[package]
name = "garbled-circuit"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
criterion = "0.5.1"

[features]
test-support = ["sl-mpc-mate/simple-relay"]

[[bench]]
name = "gc_garble_bench"
harness = false

[[bench]]
name = "gc_eval_bench"
harness = false

[dependencies]
aes = "0.8.4"
regex = "1.11.1"
rand = "0.9.0"
rand_chacha = "0.9.0"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.131"
aes-gcm = "0.10.3"
sl-compute = { git = "https://github.com/silence-laboratories/sl-compute.git", branch = "sahamati-queries" }
tokio = { version = "1.24.1", features = ["full"] }
sl-mpc-mate = { git = "https://github.com/silence-laboratories/sl-crypto.git", rev = "ff63353", features = ["simple-relay"] }
sha2 = "0.10.8"
merlin = "3.0.0"
