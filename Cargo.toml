[package]
name = "garbled-circuit"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
criterion = "0.5.1"
tokio = { workspace = true, features = [
    "rt",
    "sync",
    "macros",
    "rt-multi-thread",
] }
merlin = "3.0.0"

[features]
test-support = ["sl-mpc-mate/simple-relay"]

[[bench]]
name = "gc_garble_bench"
harness = false

[[bench]]
name = "gc_eval_bench"
harness = false

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10.8"
signature = { version = "2.2.0" }
thiserror = "1.0"
generic-array = { workspace = true }

sl-compute-common = { workspace = true }
sl-mpc-mate = { workspace = true }
sl-messages = { workspace = true }

[workspace.dependencies]
tokio = "1.43.0"
generic-array = { version = "=0.14.7" }

sl-compute-common = { git = "https://github.com/silence-laboratories/sl-crypto.git", rev = "29f48e1" }
sl-mpc-mate = { git = "https://github.com/silence-laboratories/sl-crypto.git", rev = "29f48e1" }
sl-messages = { git = "https://github.com/silence-laboratories/sl-crypto.git", rev = "29f48e1" }

[workspace]
members = [
    ".",
    "crates/hd-migration",
]
